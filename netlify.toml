[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "node_modules/sql.js/dist/sql-wasm.wasm",
    "server/**"
  ]
  external_node_modules = [
    "serverless-http",
    "express",
    "cors",
    "ws",
    "sql.js",
    "qrcode",
    "@netlify/blobs"
  ]

# API routes forwarded to serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
